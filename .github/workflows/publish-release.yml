name: Publier une version stable MaClasse

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag à créer et publier (doit correspondre à VERSION.txt, ex. v25.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/tests.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Récupérer le code de la version taguée
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python et les dépendances de signature
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances Python
        run: python -m pip install -r requirements.txt

      - name: Vérifier la cohérence du tag et de VERSION.txt
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="$(tr -d '\r\n' < VERSION.txt)"
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$VERSION" == "V${TAG#v}" ]] || {
            echo "Le tag $TAG ne correspond pas à VERSION.txt ($VERSION)." >&2
            exit 1
          }
          VERSION_NUMBER="${TAG#v}"
          grep -Fq "APP_VERSION='$VERSION_NUMBER'" server.py
          grep -Fq "const MC_VERSION='V$VERSION_NUMBER'" _all.js
          echo "version=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Créer ou vérifier le tag après validation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "La publication manuelle doit être lancée depuis main." >&2
              exit 1
            }
            git fetch origin --tags --force
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              EXISTING_COMMIT="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
              [[ "$EXISTING_COMMIT" == "$GITHUB_SHA" ]] || {
                echo "Le tag $RELEASE_TAG existe déjà sur un autre commit ($EXISTING_COMMIT)." >&2
                exit 1
              }
              echo "Le tag $RELEASE_TAG existe déjà sur le commit validé."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "MaClasse $RELEASE_TAG"
              git push origin "refs/tags/$RELEASE_TAG"
              echo "Tag $RELEASE_TAG créé sur le commit validé."
            fi
          else
            [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]] || {
              echo "La référence déclenchée ne correspond pas au tag demandé." >&2
              exit 1
            }
            EXISTING_COMMIT="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
            [[ "$EXISTING_COMMIT" == "$GITHUB_SHA" ]] || {
              echo "Le tag $RELEASE_TAG ne pointe pas sur le commit déclencheur." >&2
              exit 1
            }
          fi

      - name: Construire l'archive et le manifeste vérifié
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          NOTES_FILE=".github/release-notes/${RELEASE_TAG}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            cp "$NOTES_FILE" dist/release-notes.md
            echo "Notes de version personnalisées utilisées : $NOTES_FILE"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body > dist/release-notes.md
            echo "Aucun fichier de notes dédié ; notes GitHub générées automatiquement."
          fi
          git archive --format=zip "$GITHUB_SHA" > dist/maclasse-update.zip
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          archive = Path("dist/maclasse-update.zip")
          manifest = {
              "schema_version": 1,
              "version": os.environ["RELEASE_VERSION"],
              "tag_name": os.environ["RELEASE_TAG"],
              "min_data_schema": 25011,
              "archive_asset": archive.name,
              "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "release_notes": Path("dist/release-notes.md").read_text(encoding="utf-8")[:20000]
          }
          Path("dist/maclasse-update.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Signer le manifeste avec la clé éditeur
        env:
          MACLASSE_RELEASE_SIGNING_KEY_B64: ${{ secrets.MACLASSE_RELEASE_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          python scripts/sign_release.py --manifest dist/maclasse-update.json --signature dist/maclasse-update.sig

      - name: Publier ou compléter la release stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/maclasse-update.zip dist/maclasse-update.json dist/maclasse-update.sig --clobber
            gh release edit "$TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" dist/maclasse-update.zip dist/maclasse-update.json dist/maclasse-update.sig --notes-file dist/release-notes.md
          fi
