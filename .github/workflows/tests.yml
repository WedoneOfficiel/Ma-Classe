name: MaClasse — tests automatisés

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances Python
        run: python -m pip install -r requirements.txt
      - name: Vérifier la syntaxe JavaScript
        run: node --check _all.js
      - name: Vérifier les lanceurs macOS
        run: bash -n Installer-MaClasse.command Lancer-MaClasse.command Lancer-MaClasse-Reseau.command Configurer-MaClasse-Reseau.command Mettre-A-Jour-MaClasse.command Installer-MaClasse-Linux.sh Lancer-MaClasse-Reseau.sh Configurer-MaClasse-Reseau.sh Mettre-A-Jour-MaClasse-Linux.sh
      - name: Exécuter tous les tests JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Compiler le serveur Python
        run: python -m py_compile server.py
      - name: Exécuter tous les tests Python
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.py; do
            echo "::group::$test"
            python "$test"
            echo "::endgroup::"
          done
  macos-validation:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier les lanceurs macOS
        run: bash -n Installer-MaClasse.command Lancer-MaClasse.command Lancer-MaClasse-Reseau.command

      - name: Afficher la plateforme du runner macOS
        run: |
          uname -a
          python -c "import platform; print(platform.platform(), platform.machine())"
      - name: Tester réellement l'installateur Apple Silicon
        if: runner.arch == 'ARM64'
        run: ./Installer-MaClasse.command
      - name: Vérifier JavaScript
        run: node --check _all.js
      - name: Compiler Python
        run: python -m py_compile server.py
      - name: Tests JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.js; do node "$test"; done
      - name: Exécuter tous les tests Python
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.py; do
            echo "::group::$test"
            python "$test"
            echo "::endgroup::"
          done
