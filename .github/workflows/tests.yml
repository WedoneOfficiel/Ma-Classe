name: MaClasse — tests automatisés

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/v25-student-teacher-workflows]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances Python
        run: python -m pip install -r requirements.txt
      - name: Tester réellement l'installateur Linux
        run: ./Installer-MaClasse-Linux.sh
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check _all.js
          node --check class_tracking.js
      - name: Vérifier les lanceurs macOS
        run: bash -n Installer-MaClasse.command Lancer-MaClasse.command Lancer-MaClasse-Reseau.command Installer-Service-MaClasse-macOS.sh Lancer-MaClasse-Service-macOS.sh Appliquer-Mise-A-Jour-MaClasse-macOS.sh Configurer-MaClasse-Reseau.command Mettre-A-Jour-MaClasse.command Installer-MaClasse-Linux.sh Lancer-MaClasse-Reseau.sh Configurer-MaClasse-Reseau.sh Mettre-A-Jour-MaClasse-Linux.sh Installer-Service-MaClasse-Linux.sh Desinstaller-Service-MaClasse-Linux.sh Lancer-MaClasse-Service-Linux.sh Appliquer-Mise-A-Jour-MaClasse-Linux.sh Installer-Service-MaClasse-macOS.sh Lancer-MaClasse-Service-macOS.sh Appliquer-Mise-A-Jour-MaClasse-macOS.sh
      - name: Exécuter tous les tests JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Compiler le serveur Python
        run: python -m py_compile server.py
      - name: Exécuter tous les tests Python
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.py; do
            if [[ "$test" == "tests/test_macos_supervisor.py" ]]; then continue; fi
            echo "::group::$test"
            python -c 'import subprocess,sys; subprocess.run([sys.executable, sys.argv[1]], check=True, timeout=90)' "$test"
            echo "::endgroup::"
          done
  macos-validation:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier les lanceurs macOS
        run: bash -n Installer-MaClasse.command Lancer-MaClasse.command Lancer-MaClasse-Reseau.command

      - name: Afficher la plateforme du runner macOS
        run: |
          uname -a
          python -c "import platform; print(platform.platform(), platform.machine())"
      - name: Tester réellement l'installateur Apple Silicon
        if: runner.arch == 'ARM64'
        run: ./Installer-MaClasse.command
      - name: Vérifier JavaScript
        run: |
          node --check _all.js
          node --check class_tracking.js
      - name: Compiler Python
        run: python -m py_compile server.py
      - name: Tests JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.js; do node "$test"; done
      - name: Tester launchd réel sur macOS
        run: python -c 'import subprocess,sys; subprocess.run([sys.executable, sys.argv[1]], check=True, timeout=160)' tests/test_macos_supervisor.py
      - name: Exécuter tous les tests Python
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.py; do
            echo "::group::$test"
            python -c 'import subprocess,sys; subprocess.run([sys.executable, sys.argv[1]], check=True, timeout=90)' "$test"
            echo "::endgroup::"
          done

  firefox-schedule-regression:
    name: Régression EDT — Firefox réel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps firefox
      - name: Tester l’EDT dans Firefox
        run: python tests/browser/test_v25_schedule_firefox.py
      - name: Publier les captures des modules (clair et sombre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maclasse-v25-product-screenshots
          path: artifacts/browser-v25/
          if-no-files-found: warn
          retention-days: 7
