input[type="checkbox"]{width:17px;height:17px;min-width:17px;border-radius:5px;border:1px solid rgba(60,60,67,.25);background:rgba(255,255,255,.72);display:inline-grid;place-content:center;vertical-align:-3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06),inset 0 1px rgba(255,255,255,.75);transition:background .13s,border-color .13s,box-shadow .13s}
input[type="checkbox"]:hover{border-color:rgba(10,132,255,.46);background:#fff}
input[type="checkbox"]:checked{background:linear-gradient(180deg,#0a84ff,#007aff);border-color:#0071e3;box-shadow:0 2px 6px rgba(0,122,255,.22),inset 0 1px rgba(255,255,255,.30)}
input[type="checkbox"]:checked:after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
input[type="radio"]{width:17px;height:17px;border-radius:50%;border:1px solid rgba(60,60,67,.25);background:rgba(255,255,255,.72);display:inline-grid;place-content:center;vertical-align:-3px}
input[type="radio"]:checked{border-color:#0071e3;box-shadow:inset 0 0 0 4px #fff;background:#0a84ff}

/* Local popovers and modal surfaces */
.modalback{background:rgba(20,20,24,.26);backdrop-filter:blur(16px) saturate(115%);-webkit-backdrop-filter:blur(16px) saturate(115%)}
.modal{width:min(920px,calc(100vw - 36px));max-height:min(90vh,900px);padding:20px 20px 18px;background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(248,249,251,.74));border-color:rgba(255,255,255,.90);box-shadow:var(--ui-shadow-float);overflow:auto;overscroll-behavior:contain}
.modalhead{position:sticky;top:-20px;z-index:2;padding:1px 0 12px;margin-bottom:14px;background:linear-gradient(180deg,rgba(255,255,255,.93),rgba(255,255,255,.70),transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.modalfoot{position:sticky;bottom:-18px;z-index:2;background:linear-gradient(0deg,rgba(248,249,251,.94),rgba(248,249,251,.78),transparent);padding-bottom:2px}
.close{color:var(--ui-text);cursor:pointer}

/* Local select: native element is hidden, visible UI is ours. */
.mcSelectTrigger{color:var(--ui-text)!important;background:linear-gradient(180deg,rgba(255,255,255,.76),rgba(248,248,250,.58));border-color:var(--ui-line-strong);box-shadow:inset 0 1px rgba(255,255,255,.78),0 1px 2px rgba(0,0,0,.035)}

.mcSelectOption{color:var(--ui-text)}
.mcSelectOption:hover,.mcSelectOption:focus-visible{background:rgba(10,132,255,.10)}
.mcSelectOption.selected{background:rgba(10,132,255,.13);color:#0068d7}

/* ===== V11.4 — interface remediation: coherent light/dark + real glass + native scrolling ===== */
:root{
  --glass-bg:rgba(255,255,255,.54);
  --glass-bg-strong:rgba(255,255,255,.70);
  --glass-bg-soft:rgba(255,255,255,.38);
  --glass-line:rgba(60,60,67,.14);
  --glass-highlight:rgba(255,255,255,.82);
  --content-bg:rgba(255,255,255,.66);
}
html,body{overflow-x:hidden;overflow-y:auto;scroll-behavior:smooth;scrollbar-width:auto;scrollbar-color:auto}
body{overscroll-behavior:auto}
.tablewrap,.daycourses,.finderGrid,.finderList,.modal{overscroll-behavior:auto}
/* Do not replace Firefox's scrolling model with a cosmetic scrollbar. */
::-webkit-scrollbar{width:auto;height:auto}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(118,118,128,.34);border:3px solid transparent;background-clip:padding-box;border-radius:999px}

/* Shared glass language: navigation, toolbar, controls and secondary surfaces. */
.card,.profile360Card,.bulletin,.actionRow,.statMini,.metric,.drop,.message,.file,
.profile360Link,.profileTab,.profile360Tab,.tab,.statusBtn,.quickAction,.activityCard,
.scheduleToolbar,.documentsToolbar,.finderItem,.finderWork,.finderWorkMain,.docFolder,
.docRoot,.docClass,.docSubject,.docWork{
  background:var(--content-bg);
  border-color:var(--glass-line);
}
.card,.profile360Card,.bulletin,.activityCard{box-shadow:0 8px 26px rgba(0,0,0,.045),inset 0 1px rgba(255,255,255,.42)}
.card,.profile360Card,.bulletin,.activityCard,.finderItem,.finderWork,.docFolder,.docRoot,.docClass,.docSubject,.docWork{
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
}
.btn,.tab,.profileTab,.profile360Tab,.statusBtn,.quickAction{
  border-color:var(--glass-line);
  background:linear-gradient(180deg,var(--glass-bg-strong),var(--glass-bg));
  box-shadow:inset 0 1px var(--glass-highlight),0 1px 2px rgba(0,0,0,.035);
  backdrop-filter:blur(16px) saturate(155%);-webkit-backdrop-filter:blur(16px) saturate(155%);
}
.btn:hover,.tab:hover,.profileTab:hover,.profile360Tab:hover,.statusBtn:hover,.quickAction:hover{background:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.60));}
.btn.primary,.tab.active,.profileTab.active,.profile360Tab.active{background:linear-gradient(180deg,#0a84ff,#007aff);border-color:#0071e3;color:#fff;box-shadow:0 4px 12px rgba(0,122,255,.20),inset 0 1px rgba(255,255,255,.28)}

/* Eliminate legacy opaque white surfaces in light mode. */
.actionRow,.profileTab,.profile360Tab,.finderItem,.finderWork,.finderWorkMain,.workTrack,
.statMini,.miniKpi,.bulkBar,.gradebookMatrix th:first-child,.gradebookMatrix td:first-child,
.evaltable th:first-child,.evaltable td:first-child{background:var(--content-bg)!important;color:var(--ui-text)}
.workTrack{border-color:var(--glass-line)}
.miniKpi,.bulkBar{backdrop-filter:blur(16px) saturate(145%);-webkit-backdrop-filter:blur(16px) saturate(145%)}
.progress{background:rgba(118,118,128,.14)}

/* Fields are also part of the material system. */
.input,select,textarea,.mcSelectTrigger{
  background:rgba(255,255,255,.48)!important;
  border-color:var(--glass-line)!important;
  color:var(--ui-text)!important;
  box-shadow:inset 0 1px rgba(255,255,255,.62),0 1px 2px rgba(0,0,0,.025);
  backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);
}
.input:hover,select:hover,textarea:hover,.mcSelectTrigger:hover{background:rgba(255,255,255,.62)!important}
.input:focus,select:focus,textarea:focus,.mcSelectTrigger:focus-visible{border-color:rgba(10,132,255,.55)!important;box-shadow:0 0 0 3px rgba(10,132,255,.12),inset 0 1px rgba(255,255,255,.62)!important}

/* Finder / documents: one visual system instead of white nested boxes. */
.docSections,.finderShell{background:var(--glass-bg-soft)!important;border-color:var(--glass-line)!important;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
.docRoot>summary,.docClass>summary,.docSubject>summary,.docWork>summary{background:rgba(255,255,255,.34)!important;color:var(--ui-text)}
.finderItem:hover,.finderWorkMain:hover{background:rgba(255,255,255,.68)!important;border-color:rgba(10,132,255,.28)!important;box-shadow:0 8px 24px rgba(0,0,0,.08)}

/* ===== V11.5 — dark/light material cleanup + visible blue Liquid Glass accents ===== */
html,body{background:var(--ui-bg)!important;color:var(--ui-text)!important}
/* The blue ambient material is intentional in BOTH themes. */
body:before{content:"";position:fixed;z-index:-2;pointer-events:none;width:760px;height:560px;left:-150px;top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(10,132,255,.105) 0%,rgba(10,132,255,.055) 32%,transparent 72%);filter:blur(8px)}
body:after{content:"";position:fixed;z-index:-2;pointer-events:none;width:900px;height:620px;right:-280px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(10,132,255,.075) 0%,rgba(10,132,255,.035) 34%,transparent 72%);filter:blur(10px)}
/* A third, very subtle blue wash keeps long pages from feeling dead. */
.main:before{content:"";position:fixed;z-index:-1;pointer-events:none;width:620px;height:500px;left:38%;bottom:-300px;border-radius:50%;background:radial-gradient(circle,rgba(10,132,255,.045),transparent 70%);filter:blur(16px)}
/* Active navigation gets the little blue macOS-style accent in light AND dark. */
.nav button{position:relative;overflow:visible}
.nav button.active:before{content:"";position:absolute;left:-4px;top:9px;bottom:9px;width:3px;border-radius:999px;background:#0a84ff;box-shadow:0 0 12px rgba(10,132,255,.52)}
/* Schedule: remove every old white grid surface. */
.scheduleGrid,.schedule,.weekdays,.dayrow,.scheduleGrid .hours,.daycourses{background:transparent!important}
.scheduleGrid .hours{border-color:var(--ui-line)!important}
.scheduleGrid .hour{color:var(--ui-text-3)!important;border-color:var(--ui-line)!important;background:transparent!important}
.daycol{background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 71px,rgba(128,128,128,.10) 72px)!important;border-color:var(--ui-line)!important}
.daycolHeader{background:rgba(255,255,255,.42)!important;color:var(--ui-text)!important;border-color:var(--ui-line)!important;backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}
.dayname{background:rgba(255,255,255,.34)!important;color:var(--ui-text)!important;border-color:var(--ui-line)!important;backdrop-filter:blur(16px) saturate(145%);-webkit-backdrop-filter:blur(16px) saturate(145%)}
.dayname small{color:var(--ui-text-3)!important}
/* Timetable events use their real subject colour but stay glassy rather than flat. */
.event{background:color-mix(in srgb,var(--event-bg,var(--ui-blue-soft)) 62%,transparent)!important;border-color:color-mix(in srgb,var(--event-border,var(--ui-blue)) 70%,transparent)!important;border-left:4px solid var(--event-accent,var(--ui-blue))!important;box-shadow:inset 0 1px rgba(255,255,255,.38),0 4px 14px rgba(0,0,0,.045);backdrop-filter:blur(14px) saturate(145%);-webkit-backdrop-filter:blur(14px) saturate(145%)}
.event b{color:var(--event-accent,var(--ui-blue))!important}.event small{color:var(--ui-text-2)!important}.eventEdit{background:rgba(255,255,255,.55)!important;color:var(--ui-text)!important;border:1px solid var(--glass-line)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.eventGroup{background:rgba(255,255,255,.42)!important;color:var(--event-accent,var(--ui-blue))!important;border:1px solid rgba(255,255,255,.22)}
/* Subject legend is glass, not a white strip. */
.schedule .chip,.chip{background:rgba(255,255,255,.42)!important;color:var(--ui-text)!important;border-color:var(--glass-line)!important;box-shadow:inset 0 1px rgba(255,255,255,.38)}
/* Other course/day surfaces that inherited white from the original stylesheet. */
.course{background:color-mix(in srgb,var(--event-bg,var(--ui-blue-soft)) 52%,transparent)!important;border-color:rgba(10,132,255,.24)!important;box-shadow:inset 0 1px rgba(255,255,255,.42),0 4px 14px rgba(0,0,0,.035);backdrop-filter:blur(14px) saturate(145%);-webkit-backdrop-filter:blur(14px) saturate(145%)}
.course:hover{background:rgba(10,132,255,.15)!important}.course b{color:var(--ui-blue)!important}.course small,.course .time{color:var(--ui-text-2)!important}
.dayBtn,.rich,.richbar button,.folderBox,.submissionFile{background:var(--content-bg)!important;color:var(--ui-text)!important;border-color:var(--glass-line)!important}
.dayBtn.active{background:linear-gradient(180deg,#0a84ff,#007aff)!important;color:#fff!important;border-color:#0071e3!important}
.richbar button:hover{background:rgba(10,132,255,.10)!important}
/* Status/utility areas: no hard-coded light fill. */
.metric,.drop,.message,.file,.profile360Link,.statMini,.miniKpi,.workTrack,.bulkBar{color:var(--ui-text)!important}
.field label{color:var(--ui-text-2)!important}
.table tr:hover td{background:rgba(10,132,255,.055)!important}
.evaltable th:first-child,.evaltable td:first-child{background:var(--content-bg)!important}
/* Light theme: make the glass more obvious without turning everything blue. */
@media(prefers-color-scheme:light){
 .side{box-shadow:10px 0 40px rgba(10,40,80,.08)}
 .top{background:rgba(255,255,255,.52)!important}

}

    menu.addEventListener('keydown',e=>{const rows=[...menu.querySelectorAll('.mc-select-option:not([hidden])')];const cur=document.activeElement,idx=rows.indexOf(cur);if(e.key==='Escape'){e.preventDefault();wrap.classList.remove('open');syncSelect(wrap);trigger.focus()}else if(e.key==='ArrowDown'){e.preventDefault();rows[Math.min(rows.length-1,idx+1)]?.focus()}else if(e.key==='ArrowUp'){e.preventDefault();rows[Math.max(0,idx-1)]?.focus()}else if((e.key==='Enter'||e.key===' ')&&cur?.classList.contains('mc-select-option')){e.preventDefault();cur.click()}});
    const observer=new MutationObserver(()=>{rebuildSelectMenu(wrap)});observer.observe(s,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','hidden','selected']});
    syncSelect(wrap);
  }
  function buildAutocomplete(input){
    if(!input||input.dataset.mcAutocomplete==='1')return;const listId=input.getAttribute('list');if(!listId)return;const list=document.getElementById(listId);if(!list)return;
    const values=[...list.querySelectorAll('option')].map(o=>o.value||o.textContent.trim()).filter(Boolean);if(!values.length)return;
    input.dataset.mcAutocomplete='1';input.removeAttribute('list');const wrap=document.createElement('div');wrap.className='mc-autocomplete';input.parentNode.insertBefore(wrap,input);wrap.append(input);const menu=document.createElement('div');menu.className='mc-autocomplete-menu';wrap.append(menu);
    const render=()=>{const q=input.value.trim().toLocaleLowerCase('fr');menu.innerHTML='';values.filter(v=>!q||v.toLocaleLowerCase('fr').includes(q)).slice(0,30).forEach(v=>{const b=document.createElement('button');b.type='button';b.className='mc-autocomplete-option';b.textContent=v;b.addEventListener('click',()=>{input.value=v;menu.innerHTML='';wrap.classList.remove('open');input.dispatchEvent(new Event('input',{bubbles:true}));input.focus()});menu.append(b)});wrap.classList.toggle('open',menu.children.length>0)};
    input.addEventListener('focus',render);input.addEventListener('input',render);input.addEventListener('keydown',e=>{if(e.key==='Escape'){wrap.classList.remove('open')}else if(e.key==='ArrowDown'){const b=menu.querySelector('.mc-autocomplete-option');if(b){e.preventDefault();b.focus()}}});menu.addEventListener('keydown',e=>{if(e.key==='Escape'){wrap.classList.remove('open');input.focus()}if(e.key==='Enter'&&document.activeElement?.classList.contains('mc-autocomplete-option'))document.activeElement.click()});
  }
  function enhanceAutocomplete(root=document){root.querySelectorAll('input[list]:not([data-mc-autocomplete])').forEach(buildAutocomplete)}
  function enhance(root=document){root.querySelectorAll('select:not([data-mc-select])').forEach(build);enhanceAutocomplete(root)}
  window.mcEnhanceControls=enhance;
  window.mcSyncSelects=()=>document.querySelectorAll('.mc-select').forEach(syncSelect);
  window.mcPrompt=function(label,value='',title='Saisie'){
    return new Promise(resolve=>{
      openModal(title,`<div class="field"><label>${esc(label)}</label><input class="input" id="mcPromptInput" value="${esc(value)}" autocomplete="off"></div><div class="modalfoot"><button type="button" class="btn" data-mc-cancel>Annuler</button><button type="button" class="btn primary" data-mc-ok>Valider</button></div>`);
      const finish=v=>{closeModal();resolve(v)};
      $('#modal [data-mc-cancel]')?.addEventListener('click',()=>finish(null));
      $('#modal [data-mc-ok]')?.addEventListener('click',()=>finish($('#mcPromptInput')?.value??''));
      $('#mcPromptInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#modal [data-mc-ok]')?.click()}if(e.key==='Escape'){e.preventDefault();finish(null)}});
      $('#mcPromptInput')?.focus();$('#mcPromptInput')?.select();
    });
  };
  window.mcConfirm=function(message,title='Confirmation'){
    return new Promise(resolve=>{
      const previous=$('#modal')?.innerHTML||'';
      openModal(title,`<div class="notice">${esc(message)}</div><div class="modalfoot"><button type="button" class="btn" data-mc-cancel>Annuler</button><button type="button" class="btn primary" data-mc-ok>Confirmer</button></div>`);
      const finish=v=>{closeModal();resolve(v)};
      $('#modal [data-mc-cancel]')?.addEventListener('click',()=>finish(false));
      $('#modal [data-mc-ok]')?.addEventListener('click',()=>finish(true));
      $('#modal [data-mc-ok]')?.focus();
    });
  };
  const observer=new MutationObserver(muts=>{for(const m of muts)for(const n of m.addedNodes){if(n.nodeType===1)enhance(n)}});
  function boot(){enhance();observer.observe(document.body,{childList:true,subtree:true});document.addEventListener('click',e=>{if(!e.target.closest('.mc-select'))closeAll()});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
